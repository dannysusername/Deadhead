server.port=${PORT:8787}
spring.application.name=deadhead
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Sign-in is per account (see the users table) — there is no shared password
# and no credential in this file. Sessions are cookie-based.
server.servlet.session.timeout=30d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Heroku terminates TLS at the router, so trust its forwarded scheme headers
# and let the session cookie be marked secure when the request really was HTTPS.
server.forward-headers-strategy=native

# Errors reach the browser as RFC-7807 problems; nothing else about them should.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
