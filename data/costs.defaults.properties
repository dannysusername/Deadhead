# ── Deadhead — defaults for a new account ─────────────────────────
# Every new user starts from this file, then edits their own copy in
# the app's Settings panel. Their edits are stored per-account in the
# database and never touch this file.
#
# Nothing here is personal: no tail numbers, no home base, no client data.

# Default home base — blank means "ask the user on first run".
home=

# The plane, for the "find my plane" ADS-B lookup. Blank until the user
# enters their own tail number in Settings.
tail=
hex=

# ── The aircraft (Cirrus SR22-class defaults) ─────────────────────
cruiseKts=172
# fuel: ~17.5 gal/hr of 100LL at ~$6.60/gal
fuelPerHour=115
# engine wear + maintenance reserve per flight hour
enginePerHour=85
# preflight + taxi + climb overhead added to every flight, in hours
flightOverheadHours=0.25

# ── The pilot ─────────────────────────────────────────────────────
# what an hour of your life is worth, in dollars (drives every tradeoff!)
timeValuePerHour=50

# ── Ground travel (uber/taxi estimate) ────────────────────────────
uberBase=5
uberPerMile=2.0
# road miles ~= straight-line miles x this factor
roadFactor=1.3
avgRoadMph=55

# ── Overnights ────────────────────────────────────────────────────
# hotel per night when not home (raise this if you HATE hotels —
# it represents money + misery)
hotelPerNight=140

# ── Calendar ──────────────────────────────────────────────────────
# Published webcal/https link, set per account in Settings.
calendarUrl=
